<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var m = location.search.match(/[?&]theme=([^&]*)/);
  if (m && m[1]) {
    document.documentElement.setAttribute('data-theme', decodeURIComponent(m[1]));
  }
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'kt-theme') {
      var v = e.data.value;
      if (v) {
        document.documentElement.setAttribute('data-theme', v);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }
  });
})();
</script>

  <style>

      --th-accent1: #c070f8; --th-accent2: #70b8f8; --th-accent-hi: #e0a0ff;
      --th-border: #3a2e60; --th-border2: #7060b0;
      --th-card: #201a50; --th-card2: #100c28; --th-panel: #140e30;

      --th-focus-ring: rgba(192,112,248,0.28);

    [data-theme="vampire"] {
      --th-void: #080204; --th-abyss: #120410; --th-stone: #200c14;
      --th-bone: #fff4ec; --th-bone-dim: #e0a888; --th-bone-faint: #c07878;
      --th-accent1: #ff3860; --th-accent2: #e88870; --th-accent-hi: #ff7090;
      --th-border: #3a1820; --th-border2: #5a2830;

      --th-focus-ring: rgba(255,56,96,0.28);

    [data-theme="dungeon"] {

      --th-accent1: #48b870; --th-accent2: #d4a040; --th-accent-hi: #70d890;
      --th-border: #1e3828; --th-border2: #2e5038;

    [data-theme="escape"] {

      --th-bone: #eeeeee; --th-bone-dim: #c0c0c0; --th-bone-faint: #909090;

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--th-abyss); }

    .btn.ghost { border-color: var(--th-border2); color: var(--th-bone-dim); background: transparent; }

    .tab-btn {

    input, textarea, select {
      background: var(--th-card2); border: 1px solid var(--th-border2); color: var(--th-bone);
      padding: 9px 13px; border-radius: 5px;

    input:focus, textarea:focus, select:focus {

    }
    select option { background: var(--th-card); color: var(--th-bone); }
    textarea { resize: vertical; min-height: 80px; }

    .field-label {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;

    .tag {

    }

    .char-card {
      background: var(--th-card); border: 1px solid var(--th-border); border-radius: 8px;

    .char-card:hover { border-color: var(--th-accent1); background: var(--th-abyss); }

    .char-card .card-titles { font-size: 13px; font-style: italic; color: var(--th-bone-dim); }
    .char-card .card-meta   { font-size: 13px; color: var(--th-bone-dim); }
    .char-card .card-actions{ display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; opacity: 0; transition: opacity 0.15s; }

    .rel-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; border-bottom: 1px solid var(--th-border); transition: background 0.15s; }
    .rel-row:hover { background: var(--th-card); }

    .sidebar-char-header { background: linear-gradient(135deg, var(--th-stone) 0%, var(--th-abyss) 100%); border-bottom: 1px solid var(--th-border2); padding: 15px 16px; }

    .divider { border: none; border-top: 1px solid var(--th-border); margin: 12px 0; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);

    @keyframes toastIn {

    .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); display:flex; align-items:center; justify-content:center; z-index:300; }

    .confirm-title { font-family:'Cinzel',serif; font-size:15px; color:var(--th-accent-hi); margin-bottom:12px; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.82); display:flex; align-items:center; justify-content:center; z-index:200; }
    .modal-box { background:var(--th-card); border:1px solid var(--th-border2); border-radius:12px; width:540px; max-width:96vw; max-height:92vh; overflow-y:auto; box-shadow:0 24px 80px rgba(0,0,0,0.8); }
    .modal-header { padding:20px 24px 16px; border-bottom:1px solid var(--th-border); font-family:'Cinzel',serif; font-size:16px; color:var(--th-accent2); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg, var(--th-stone) 0%, var(--th-card) 100%); }
    .modal-body   { padding:6px 24px 24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--th-border); display:flex; gap:8px; justify-content:flex-end; background:var(--th-card2); }
    .form-section { background:var(--th-card2); border:1px solid var(--th-border); border-radius:8px; padding:14px 16px; margin-top:16px; }
    .form-section-title { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--th-accent1); margin-bottom:6px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .form-full  { grid-column:1/-1; }

    .ctx-menu { position:fixed; z-index:500; background:var(--th-card); border:1px solid var(--th-border2); border-radius:8px; padding:4px 0; min-width:190px; box-shadow:0 8px 32px rgba(0,0,0,0.75); font-family:'EB Garamond',serif; animation:ctxIn 0.1s ease-out; }
    @keyframes ctxIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
    .ctx-label { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--th-bone-dim); padding:8px 14px 5px; display:block; }
    .ctx-item  { display:flex; align-items:center; gap:9px; padding:8px 14px; font-size:14px; color:var(--th-bone); cursor:pointer; transition:background 0.1s; white-space:nowrap; background:none; border:none; width:100%; text-align:left; font-family:'EB Garamond',serif; font-weight:600; }
    .ctx-item:hover { background:var(--th-stone); }
    .ctx-item.danger { color:#f07070; }

    .ctx-sep  { border:none; border-top:1px solid var(--th-border); margin:4px 0; }

    .ctx-type-btn { border:1px solid; border-radius:4px; padding:4px 9px; font-size:12px; font-family:'EB Garamond',serif; font-weight:600; cursor:pointer; transition:all 0.12s; white-space:nowrap; background:transparent; }

    /* Hereditary toggle pill */
    .h-toggle { display:inline-flex; align-items:center; gap:9px; cursor:pointer; padding:8px 12px; border-radius:6px; border:1px solid var(--th-border); background:var(--th-card); transition:border-color 0.15s,background 0.15s; user-select:none; width:100%; }

    .h-pip { width:34px; height:18px; border-radius:9px; background:var(--th-border2); position:relative; transition:background 0.2s; flex-shrink:0; }
    .h-pip::after { content:''; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:var(--th-bone-faint); transition:transform 0.2s,background 0.2s; }
    .h-toggle.on .h-pip { background:var(--th-accent1); }
    .h-toggle.on .h-pip::after { transform:translateX(16px); background:var(--th-void); }

    /* Welcome popup */
    .welcome-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:400; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .welcome-box { background:var(--th-card); border:1px solid var(--th-accent1); border-radius:14px; width:460px; max-width:94vw; box-shadow:0 28px 80px rgba(0,0,0,0.85),0 0 40px rgba(201,162,39,0.12); overflow:hidden; }
    .welcome-header { background:linear-gradient(135deg,var(--th-stone) 0%,var(--th-abyss) 100%); padding:28px 28px 20px; border-bottom:1px solid var(--th-border2); text-align:center; }
    .welcome-title { font-family:'Cinzel',serif; font-size:22px; color:var(--th-accent2); letter-spacing:0.08em; margin-bottom:6px; }
    .welcome-subtitle { font-size:14px; color:var(--th-bone-dim); letter-spacing:0.04em; }
    .welcome-body { padding:24px 28px; line-height:1.75; font-size:15px; color:var(--th-bone); }
    .welcome-body p { margin-bottom:14px; }
    .welcome-body p:last-child { margin-bottom:0; }
    .welcome-kofi { display:flex; align-items:center; gap:12px; background:var(--th-card2); border:1px solid var(--th-border2); border-radius:8px; padding:14px 16px; margin:16px 0 4px; text-decoration:none; transition:border-color 0.15s,background 0.15s; cursor:pointer; }
    .welcome-kofi:hover { border-color:var(--th-accent1); background:var(--th-stone); }
    .welcome-kofi-icon { font-size:26px; flex-shrink:0; }
    .welcome-kofi-text { flex:1; }
    .welcome-kofi-label { font-family:'Cinzel',serif; font-size:13px; color:var(--th-accent2); letter-spacing:0.06em; margin-bottom:2px; }
    .welcome-kofi-sub { font-size:13px; color:var(--th-bone-dim); }
    .welcome-footer { padding:16px 28px 20px; border-top:1px solid var(--th-border); display:flex; justify-content:center; }

    /* Zoom badge */
    .zoom-controls { position:absolute; bottom:14px; right:16px; display:flex; align-items:center; gap:3px; background:var(--th-abyss); border:1px solid var(--th-border); border-radius:6px; padding:2px 4px; }
    .zoom-controls button { background:none; border:none; color:var(--th-bone-faint); cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px; font-family:'EB Garamond',serif; line-height:1; transition:color 0.15s,background 0.15s; }
    .zoom-controls button:hover { color:var(--th-accent2); background:var(--th-accent2)18; }
    .zoom-badge { background:none; border:none; color:var(--th-bone-faint); padding:3px 7px; font-size:12px; font-family:'EB Garamond',serif; user-select:none; letter-spacing:0.04em; cursor:pointer; transition:color 0.15s; min-width:40px; text-align:center; }
    .zoom-badge:hover { color:var(--th-accent2); }

    /* Dynasty btn */
    .dyn-btn { background:var(--th-card2); border:1px solid var(--th-border2); color:var(--th-accent2); padding:5px 11px; border-radius:6px; cursor:pointer; font-family:'EB Garamond',serif; font-size:14px; display:inline-flex; align-items:center; gap:5px; transition:all 0.15s; white-space:nowrap; max-width:180px; flex-shrink:0; }
    .dyn-btn:hover { border-color:var(--th-accent1); background:var(--th-stone); }
    .dyn-btn span.name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px; font-weight:600; }
    .dyn-btn span.arrow { font-size:10px; opacity:0.6; flex-shrink:0; }

    /* Topbar separator */
    .tb-sep { width:1px; height:26px; background:var(--th-border); flex-shrink:0; margin:0 3px; }

    /* Keyboard hint */
    .kbd { display:inline-block; background:var(--th-stone); border:1px solid var(--th-border2); border-radius:3px; padding:1px 5px; font-size:11px; font-family:monospace; color:var(--th-bone-dim); }

    /* Undo toast */
    @keyframes toastInStay {
      0%   { opacity:0; transform:translateX(-50%) translateY(10px); }
      8%   { opacity:1; transform:translateX(-50%) translateY(0); }
      100% { opacity:1; }
    }
    .toast.toast-action { animation:toastInStay 0.3s forwards; pointer-events:all; gap:4px; }
    .toast-undo-btn { background:none; border:1px solid currentColor; padding:2px 10px; border-radius:10px; cursor:pointer; font-size:13px; font-family:'EB Garamond',serif; font-weight:600; margin-left:8px; transition:background 0.15s,color 0.15s; }
    .toast-undo-btn:hover { background:var(--th-accent1); color:var(--th-void); border-color:var(--th-accent1); }
  </style>
</head>

<div id="root"></div>
<script>
"use strict";
const { useState, useRef, useEffect } = React;
const h = React.createElement;

// ─── Constants ────────────────────────────────────────────────────────────────
const RELATIONSHIP_TYPES = ["Parent","Child","Spouse","Sibling","Adopted","Guardian","Rival","Ally","Enemy","Mentor","Apprentice","Other"];

const THEME_PALETTES = {
  default:    ["#c9a227","#e05c7a","#5ca8d6","#9b6dca","#a3c27b","#cc4444","#f0c060","#d07030","#60a890","#c070a0","#7890c8","#888878"],

  escape:     ["#e8e8e8","#b8b8b8","#888888","#d0d0d0","#f0f0f0","#a0a0a0","#c8c8c8","#787878","#e0e0e0","#909090","#d8d8d8","#686868"],
};

const RELATION_COLORS = {
  Parent:"var(--th-accent2)", Child:"var(--th-accent2)", Spouse:"#e87090", Sibling:"#60b8e0",
  Adopted:"#80c870", Guardian:"#80c870", Rival:"#e05050", Ally:"#60b8e0",
  Enemy:"#e05050", Mentor:"#a878e0", Apprentice:"#a878e0", Other:"#a09880"

const DISORDER_STATUS_COLORS = { Affected:"#e05050", Carrier:"#e0a030", Unaffected:"#60b870", Unknown:"#909090" };

// ─── Disorder propagation ─────────────────────────────────────────────────────
// Pure module-level function — no stale closures.
// Walks parent→child in topological order so grandchildren are handled correctly.
// Only propagates disorders where hereditary===true.
// Never overwrites entries with source!=="inherited".
function propagateDisorders(charList, relList) {
  // Build directed parent→child map from Parent rels (r.from=parent, r.to=child)
  const childrenOf = {}, parentOf = {};
  relList.forEach(r => {
    if (r.type !== "Parent") return;
    const p = r.from, c = r.to;
    (childrenOf[p] = childrenOf[p]||[]).includes(c) || childrenOf[p].push(c);
    (parentOf[c]   = parentOf[c]  ||[]).includes(p) || parentOf[c].push(p);
  });

  // Topological BFS — parents always processed before their children
  const allIds   = charList.map(c => c.id);
  const inDeg    = Object.fromEntries(allIds.map(id => [id, (parentOf[id]||[]).length]));
  const queue    = allIds.filter(id => inDeg[id] === 0);
  const order    = [];
  const seen     = new Set();
  while (queue.length) {
    const id = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id); order.push(id);
    (childrenOf[id]||[]).forEach(cid => { if (--inDeg[cid] <= 0 && !seen.has(cid)) queue.push(cid); });
  }
  allIds.forEach(id => { if (!seen.has(id)) order.push(id); }); // cycles safety

  // Deep-copy so React state is never mutated directly
  const cm = Object.fromEntries(charList.map(c => [c.id, {...c, disorders:(c.disorders||[]).map(d=>({...d}))}]));

  order.forEach(childId => {
    const pids = parentOf[childId] || [];
    if (!pids.length) return;

    // Collect all HEREDITARY disorders from parents (already propagated in this pass)
    const fromParents = {}; // name → [statuses from parents]
    pids.forEach(pid => {
      ((cm[pid] && cm[pid].disorders) || []).forEach(d => {
        if (!d.hereditary) return;
        (fromParents[d.name] = fromParents[d.name]||[]).push(d.status);
      });
    });

    const childDis = cm[childId].disorders;

    // Upsert inherited entries
    Object.entries(fromParents).forEach(([name, statuses]) => {
      const existing = childDis.find(d => d.name === name);
      if (existing && existing.source !== "inherited") return; // manual entry — hands off

      // If any parent is Affected or Carrier, child is at-risk → Carrier
      const atRisk = statuses.some(s => s === "Affected" || s === "Carrier");
      const inheritedStatus = atRisk ? "Carrier" : "Unaffected";

      if (existing) {
        existing.status     = inheritedStatus;
        existing.hereditary = true;
      } else {
        childDis.push({ name, hereditary:true, status:inheritedStatus, source:"inherited" });
      }
    });

    // Remove stale inherited entries (disorder no longer hereditary in any parent)
    cm[childId].disorders = childDis.filter(d => d.source !== "inherited" || fromParents[d.name]);
  });

  return Object.values(cm);
}

// Split a name into 1 or 2 lines for SVG rendering; splits at word boundary nearest the midpoint
function splitName(name) {
  if(!name) return [""];
  if(name.length<=13) return [name];
  const mid=Math.floor(name.length/2);
  let splitAt=-1, bestDist=Infinity;
  for(let i=0;i<name.length;i++){
    if(name[i]===" "){ const d=Math.abs(i-mid); if(d<bestDist){bestDist=d;splitAt=i;} }
  }
  if(splitAt!==-1) return [trunc(name.slice(0,splitAt),15), trunc(name.slice(splitAt+1),15)];
  return [trunc(name.slice(0,13),13), trunc(name.slice(13),13)];
}

function initDynasties() {
  var existing = loadDynasties();
  if(existing && Object.keys(existing).length) return existing;
  var old = null;
  try { var r=localStorage.getItem(STORAGE_KEY); if(r) old=JSON.parse(r); } catch(e){}
  var firstId = "dyn_"+Date.now();
  var dyns = {};
  dyns[firstId] = {
    id: firstId,
    name: (old && old.treeName) || DEMO.treeName,
    treeName: (old && old.treeName) || DEMO.treeName,
    chars: (old && old.chars) || DEMO.chars,
    rels:  (old && old.rels)  || DEMO.rels

  saveDynasties(dyns);
  setActiveDynastyId(firstId);
  return dyns;

// ─── Gender Icon ──────────────────────────────────────────────────────────────
function GenderIcon({gender,x,y,col}) {
  if(!gender) return null;
  const g=gender.toLowerCase().replace(/[\/\|\(\)]/g," ");
  const isMale   = /\bhe\b|\bhim\b|\bhis\b/.test(g)||/\bmale\b|\bman\b|\bmen\b|\bboy\b/.test(g)||/^m$/.test(g.trim());
  const isFemale = /\bshe\b|\bher\b|\bhers\b/.test(g)||/\bfemale\b|\bwoman\b|\bgirl\b/.test(g)||/^f$/.test(g.trim());
  const isNb     = /\bthey\b|\bthem\b/.test(g)||/\bnon.?bin/.test(g)||/\benby\b/.test(g);
  if(!isMale&&!isFemale&&!isNb) return null;
  const r=4,sw=1.4,st={pointerEvents:"none",userSelect:"none"};
  if(isMale) return h("g",{style:st},
    h("circle",{cx:x,cy:y+1,r,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x+r*.7,y1:y+1-r*.7,x2:x+r*1.7,y2:y+1-r*1.7,stroke:col,strokeWidth:sw}),
    h("polyline",{points:(x+r*1.1)+","+(y+1-r*1.7)+" "+(x+r*1.7)+","+(y+1-r*1.7)+" "+(x+r*1.7)+","+(y+1-r*1.1),fill:"none",stroke:col,strokeWidth:sw,strokeLinejoin:"round"}));
  if(isFemale) return h("g",{style:st},
    h("circle",{cx:x,cy:y-1,r,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y-1+r,x2:x,y2:y-1+r+4,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2.5,y1:y-1+r+2.5,x2:x+2.5,y2:y-1+r+2.5,stroke:col,strokeWidth:sw}));
  return h("g",{style:st},
    h("circle",{cx:x,cy:y,r:r-.5,fill:"none",stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y-r+.5,x2:x,y2:y-r-3,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2,y1:y-r-1.5,x2:x+2,y2:y-r-1.5,stroke:col,strokeWidth:sw}),
    h("line",{x1:x,y1:y+r-.5,x2:x,y2:y+r+3,stroke:col,strokeWidth:sw}),
    h("line",{x1:x-2,y1:y+r+1.5,x2:x+2,y2:y+r+1.5,stroke:col,strokeWidth:sw}));
}

// ─── SVG CharNode ─────────────────────────────────────────────────────────────
function CharNode({c,selected,linking,dimmed,onMouseDown,onDoubleClick,onContextMenu,onMouseEnter,onMouseLeave}) {
  const isSel=selected===c.id, isLnk=linking===c.id, cx=NODE_W/2;
  const rows=[];
  if(c.role) rows.push({text:trunc(c.role,22),color:"var(--th-accent2)",size:11,italic:true});
  const sa=[c.species,c.age?"Age "+c.age:""].filter(Boolean).join(" "+dot+" ");
  if(sa) rows.push({text:trunc(sa,22),color:"var(--th-bone-dim)",size:11});
  const sp=(NODE_H-HEADER_H)/(rows.length+1);
  const ch=[];
  if(isSel||isLnk) ch.push(h("rect",{key:"ring",x:-4,y:-4,width:NODE_W+8,height:NODE_H+8,rx:NODE_RX+3,fill:"none",stroke:isLnk?"var(--th-link-hover)":"var(--th-accent2)",strokeWidth:3,filter:"url(#glow)"}));
  ch.push(h("rect",{key:"bg",width:NODE_W,height:NODE_H,rx:NODE_RX,fill:"var(--th-card)",stroke:c.color,strokeWidth:isSel?2:1.5,filter:"url(#shadow)"}));
  ch.push(h("rect",{key:"hd",width:NODE_W,height:HEADER_H,fill:c.color+"42",clipPath:"url(#node-clip)"}));
  ch.push(h("line",{key:"hl",x1:0,y1:HEADER_H,x2:NODE_W,y2:HEADER_H,stroke:c.color+"70",strokeWidth:1}));
  ch.push(h("circle",{key:"cdot",cx:9,cy:HEADER_H/2,r:4,fill:c.color}));
  const sc=statusColor(c.status);
  ch.push(h("circle",{key:"sr",cx:NODE_W-9,cy:HEADER_H/2,r:4,fill:"none",stroke:sc,strokeWidth:1.5}));
  ch.push(h("circle",{key:"sd",cx:NODE_W-9,cy:HEADER_H/2,r:2.5,fill:sc}));
  const nameLines=splitName(c.name), twoLine=nameLines.length===2;
  const nmProps={textAnchor:"middle",dominantBaseline:"central",fontSize:twoLine?11:12,fontWeight:"700",fill:"var(--th-bone)",fontFamily:"'Cinzel',serif",style:{userSelect:"none",pointerEvents:"none"}};
  if(twoLine){
    ch.push(h("text",{key:"nm1",x:cx,y:HEADER_H/2-7,...nmProps},nameLines[0]));
    ch.push(h("text",{key:"nm2",x:cx,y:HEADER_H/2+7,...nmProps},nameLines[1]));
  } else {
    ch.push(h("text",{key:"nm",x:cx,y:HEADER_H/2,...nmProps},nameLines[0]));
  }
  rows.forEach((row,i)=>ch.push(h("text",{key:"r"+i,x:cx,y:HEADER_H+sp*(i+1),textAnchor:"middle",dominantBaseline:"central",fontSize:row.size,fill:row.color,fontStyle:row.italic?"italic":"normal",fontFamily:"'EB Garamond',serif",style:{userSelect:"none",pointerEvents:"none"}},row.text)));
  return h("g",{style:{cursor:linking?"crosshair":"grab",opacity:dimmed?0.22:1,transition:"opacity 0.15s"},transform:"translate("+c.x+","+c.y+")",
    onMouseDown:e=>onMouseDown(e,c.id),
    onDoubleClick:e=>{e.stopPropagation();onDoubleClick(c);},
    onContextMenu:e=>{e.preventDefault();e.stopPropagation();if(onContextMenu)onContextMenu(e,c);},
    onMouseEnter:()=>{if(onMouseEnter)onMouseEnter(c.id);},
    onMouseLeave:()=>{if(onMouseLeave)onMouseLeave();}
  },...ch);
}

function App() {
  const [dynasties,setDynastiesState] = useState(()=>initDynasties());
  const [activeDynId,setActiveDynId]  = useState(()=>{
    var id=getActiveDynastyId();
    var d=loadDynasties();
    if(d&&id&&d[id]) return id;
    return d ? Object.keys(d)[0] : null;
  });
  const [showDynPanel,setShowDynPanel] = useState(false);
  const [dynRenameId,setDynRenameId]   = useState(null);
  const [dynRenameVal,setDynRenameVal] = useState("");

  // Helpers to persist dynasty changes
  const saveDyn = (dyns) => { setDynastiesState(dyns); saveDynasties(dyns); };
  const updateActiveDyn = (treeName,chars,rels) => {
    if(!activeDynId) return;
    var next=Object.assign({},dynasties);
    next[activeDynId]=Object.assign({},next[activeDynId],{treeName,chars,rels,name:treeName});
    saveDyn(next);
  };

  const activeDyn = dynasties[activeDynId] || Object.values(dynasties)[0] || {treeName:"",chars:[],rels:[]};

  const [treeName,setTreeName] = useState(activeDyn.treeName || DEMO.treeName);
  const [chars,setChars]       = useState(()=>(activeDyn.chars || DEMO.chars).map(c=>({...c,disorders:c.disorders||[]})));
  const [rels,setRels]         = useState(activeDyn.rels || DEMO.rels);
  const [selected,setSelected] = useState(null);
  const [editingChar,setEditingChar] = useState(null);
  const [dragging,setDragging] = useState(null);
  const [dragOffset,setDragOffset] = useState({x:0,y:0});
  const [linking,setLinking]   = useState(null);
  const [linkType,setLinkType] = useState("Parent");
  const [pan,setPan]           = useState({x:40,y:40});
  const [isPanning,setIsPanning] = useState(false);
  const [panStart,setPanStart] = useState({x:0,y:0});
  const [zoom,setZoom]         = useState(1);
  const [showSidebar,setShowSidebar] = useState(true);
  const [activePanel,setActivePanel] = useState("tree");
  const [editName,setEditName] = useState(false);
  const [toast,setToast]       = useState(null);
  const [confirm,setConfirm]   = useState(null);
  const [contextMenu,setContextMenu] = useState(null);
  const [theme,setTheme]       = useState(()=>localStorage.getItem("lineage_theme")||"default");
  const [preLayoutChars,setPreLayoutChars] = useState(null);
  const [preDeleteState,setPreDeleteState] = useState(null);
  const [charSearch,setCharSearch]         = useState("");
  const [showFileMenu,setShowFileMenu]     = useState(false);
  const [showThemePicker,setShowThemePicker] = useState(false);
  const [showWelcome,setShowWelcome]       = useState(()=>shouldShowWelcome());
  const [relTypeFilter,setRelTypeFilter]   = useState("All");
  const [hoveredChar,setHoveredChar]       = useState(null);
  const [globalSearch,setGlobalSearch]     = useState("");
  const [showGlobalSearch,setShowGlobalSearch] = useState(false);

  const svgRef=useRef(null), panRef=useRef(false), toastRef=useRef(null), fileRef=useRef(null), panClickRef=useRef(null), globalSearchRef=useRef(null);

  // Persist active dynasty whenever tree data changes
  useEffect(()=>{
    if(!activeDynId) return;
    var next=Object.assign({},dynasties);
    next[activeDynId]=Object.assign({},next[activeDynId],{treeName,chars,rels,name:treeName});
    saveDynasties(next);
    setDynastiesState(next);
  },[treeName,chars,rels]);

  useEffect(()=>{ localStorage.setItem("lineage_theme",theme); },[theme]);

  // Switch to a different dynasty
  const switchDynasty = (id) => {
    if(id===activeDynId) return;
    var dyn=dynasties[id];
    if(!dyn) return;
    setActiveDynId(id);
    setActiveDynastyId(id);
    setTreeName(dyn.treeName||dyn.name||"");
    setChars((dyn.chars||[]).map(function(c){return Object.assign({},c,{disorders:c.disorders||[]});}));
    setRels(dyn.rels||[]);
    setSelected(null);
    setLinking(null);
    setPreLayoutChars(null);
    setPan({x:40,y:40});
    setZoom(1);
    setShowDynPanel(false);
    showToast("Switched to "+dyn.name);
  };

  const createDynasty = () => {
    var id="dyn_"+Date.now();
    var next=Object.assign({},dynasties);
    next[id]={id,name:"New Dynasty",treeName:"New Dynasty",chars:[],rels:[]};
    saveDyn(next);
    switchDynasty(id);
  };

  const deleteDynasty = (id) => {
    var keys=Object.keys(dynasties);
    if(keys.length<=1){ showToast("Cannot delete the only dynasty"); return; }
    var next=Object.assign({},dynasties);
    delete next[id];
    saveDyn(next);
    if(id===activeDynId){
      var remaining=Object.keys(next)[0];
      switchDynasty(remaining);
    }
    showToast("Dynasty deleted");
  };

  const renameDynasty = (id,name) => {
    var next=Object.assign({},dynasties);
    next[id]=Object.assign({},next[id],{name:name,treeName:name});
    saveDyn(next);
    if(id===activeDynId) setTreeName(name);
    setDynRenameId(null);
  };

  const exportDynasty = (id) => {
    var dyn=dynasties[id];
    if(!dyn) return;
    var data={treeName:dyn.treeName||dyn.name,chars:dyn.chars||[],rels:dyn.rels||[]};
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    a.download=(dyn.name||"dynasty").replace(/\s+/g,"_")+".lineage.json";
    a.click();
    showToast("↓ Exported "+dyn.name);
  };

  const changeTheme = newTheme => {
    if(newTheme===theme) return;
    const all=Object.values(THEME_PALETTES), np=THEME_PALETTES[newTheme]||THEME_PALETTES.default;
    setChars(prev=>prev.map(c=>{
      let idx=-1;
      for(const pal of all){ const i=pal.indexOf(c.color); if(i!==-1){idx=i;break;} }
      return idx===-1?c:{...c,color:np[idx]};
    }));
    setTheme(newTheme);
  };

  const centerOnChar = id => {
    const c=chars.find(ch=>ch.id===id);
    if(!c||!svgRef.current) return;

  };

  const showToast = (msg, undoFn) => {
    setToast(null);
    requestAnimationFrame(()=>{
      const t=undoFn?{msg,undoFn}:msg;

      toastRef.current=setTimeout(()=>setToast(null),undoFn?6000:2800);
    });
  };

  const askConfirm = (title,msg,fn,confirmLabel) => setConfirm({title,message:msg,onConfirm:fn,confirmLabel:confirmLabel||"Confirm"});
  const getChar    = id => chars.find(c=>c.id===id);

  const addChar = () => {
    const c={id:uid(),name:"New Character",species:"Human",age:"",gender:"",status:"Alive",role:"",notes:"",
      x:200+(chars.length%5)*180,y:120+Math.floor(chars.length/5)*160,
      color:(THEME_PALETTES[theme] && THEME_PALETTES[theme][0]) || "#c9a227",titles:"",faction:"",disorders:[]};
    setChars(p=>[...p,c]); setEditingChar({...c}); setSelected(c.id);
  };

  const saveChar = updated => {
    if(!updated.name||!updated.name.trim()){ showToast("Name cannot be empty"); return; }
    setChars(prev=>propagateDisorders(prev.map(c=>c.id===updated.id?{...updated,name:updated.name.trim()}:c), rels));
    setEditingChar(null); showToast("✓ Character saved");
  };
  const quickSave = updated => {

  };
  const fitToScreen = () => {
    if(!chars.length||!svgRef.current) return;
    const {width,height}=svgRef.current.getBoundingClientRect();
    const pad=60;
    const minX=Math.min(...chars.map(c=>c.x)), minY=Math.min(...chars.map(c=>c.y));
    const maxX=Math.max(...chars.map(c=>c.x+NODE_W)), maxY=Math.max(...chars.map(c=>c.y+NODE_H));
    const treeW=maxX-minX, treeH=maxY-minY;
    const nz=Math.min(3,Math.max(0.2,Math.min((width-pad*2)/treeW,(height-pad*2)/treeH)));

  const deleteChar = id => askConfirm("Delete Character",

      setChars(prev=>propagateDisorders(prev.filter(c=>c.id!==id),nr));

  const undoLast  = () => { if(preDeleteState) undoDelete(); else if(preLayoutChars) undoLayout(); };

  const copyChar = id => {
    const orig=getChar(id); if(!orig) return;
    const c={...orig,id:uid(),name:orig.name+" (Copy)",x:orig.x+NODE_W+20,y:orig.y,
      disorders:(orig.disorders||[]).filter(d=>d.source!=="inherited")};

  };

  const exportSVG = () => {
    const svg=svgRef.current; if(!svg) return;
    const st=getComputedStyle(document.documentElement);
    const vars=['--th-void','--th-card','--th-card2','--th-stone','--th-abyss',
      '--th-border','--th-border2','--th-bone','--th-bone-dim','--th-bone-faint',
      '--th-accent1','--th-accent2','--th-accent-hi'].map(v=>v+':'+st.getPropertyValue(v)).join(';');

  };

  const addRel = (fromId,toId,type) => {
    // Normalize: "Child" means fromId is the child, toId is the parent — flip to store as Parent
    var actualFrom=fromId, actualTo=toId, actualType=type;
    if(type==="Child"){ actualFrom=toId; actualTo=fromId; actualType="Parent"; }

    if(actualFrom===actualTo){ showToast("A character cannot be linked to themselves"); return; }
    if(rels.find(r=>(r.from===actualFrom&&r.to===actualTo)||(r.from===actualTo&&r.to===actualFrom))){ showToast("These characters are already linked"); return; }
    if(actualType==="Parent"){
      // Guard against circular lineages (e.g. A→B→A)
      var cycleQ=[actualTo],cycleSeen=new Set();
      while(cycleQ.length){ var cur=cycleQ.shift(); if(cycleSeen.has(cur)) continue; cycleSeen.add(cur); rels.forEach(function(r){ if(r.type==="Parent"&&r.from===cur) cycleQ.push(r.to); }); }
      if(cycleSeen.has(actualFrom)){ showToast("Cannot add: this would create a circular lineage"); return; }
    }
    const nr=[...rels,{id:"r_"+Date.now(),from:actualFrom,to:actualTo,type:actualType}];
    setRels(nr);
    setChars(prev=>{
      let next=prev;
      if(actualType==="Spouse"||actualType==="Partner"){
        const a=prev.find(c=>c.id===actualFrom),b=prev.find(c=>c.id===actualTo);
        if(a&&b&&(Math.abs(a.y-b.y)>=NODE_H*.6||Math.abs(a.x-b.x)<=NODE_W+20)){
          const midY=(a.y+b.y)/2,[left,right]=a.x<=b.x?[a,b]:[b,a];
          next=prev.map(c=>c.id===left.id?{...c,y:midY}:c.id===right.id?{...c,x:left.x+NODE_W+40,y:midY}:c);
        } else {
          showToast("Tip: use ✦ Arrange to align spouses side by side");
        }
      }
      return actualType==="Parent"?propagateDisorders(next,nr):next;
    });
    showToast(type+" link added");
  };

  const deleteRel = id => {
    const nr=rels.filter(r=>r.id!==id), found=rels.find(r=>r.id===id), wasParent=found && found.type==="Parent";
    setRels(nr);
    if(wasParent) setChars(prev=>propagateDisorders(prev,nr));
    showToast("Link removed");
  };

  const changeRelType = (id,newType) => {
    const old=rels.find(r=>r.id===id);
    // If changing to Child, flip the direction and store as Parent
    var nr;
    if(newType==="Child"){
      nr=rels.map(r=>r.id===id?{...r,from:r.to,to:r.from,type:"Parent"}:r);
    } else {
      nr=rels.map(r=>r.id===id?{...r,type:newType}:r);
    }
    setRels(nr);
    if(old&&(old.type==="Parent"||newType==="Parent"||newType==="Child")) setChars(prev=>propagateDisorders(prev,nr));
    showToast("Link changed to "+newType);
  };

  const exportJSON = () => {
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify({treeName,chars,rels},null,2)],{type:"application/json"}));
    a.download=treeName.replace(/\s+/g,"_")+".lineage.json"; a.click(); showToast("↓ Exported");
  };

  const importJSON = e => {
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        var d; try{ d=JSON.parse(ev.target.result); }catch(e){ showToast("Import failed: not a valid JSON file"); return; }
        if(d.chars&&d.rels){
          // Import as a brand new dynasty
          var id="dyn_"+Date.now();
          var name=d.treeName||"Imported Dynasty";
          var next=Object.assign({},dynasties);
          next[id]={id,name,treeName:name,chars:d.chars,rels:d.rels};
          saveDyn(next);
          // Switch to it
          setActiveDynId(id);
          setActiveDynastyId(id);
          setTreeName(name);
          setChars(d.chars.map(function(c){return Object.assign({},c,{disorders:c.disorders||[]});}));
          setRels(d.rels);
          setSelected(null);
          setPreLayoutChars(null);
          setPan({x:40,y:40});
          setZoom(1);
          showToast("↑ Imported as new dynasty");
        } else { showToast("Import failed: missing 'chars' or 'rels' — is this a .lineage file?"); }
      }catch(err){showToast("Import failed");}
    };
    r.readAsText(file); e.target.value="";
  };

  const clearAll = () => askConfirm("Clear All","Remove all characters and relationships?",()=>{
    setChars([]); setRels([]); setSelected(null); setConfirm(null); showToast("Cleared");
  }, "Clear All");

  const resetToDemo = () => askConfirm("Reset to Demo","This will replace all characters and relationships with the built-in demo data. This cannot be undone.",()=>{
    setTreeName(DEMO.treeName); setChars(DEMO.chars.map(c=>({...c,disorders:c.disorders||[]}))); setRels(DEMO.rels); setSelected(null); setPreLayoutChars(null); setConfirm(null); showToast("↺ Reset to demo");
  }, "Reset");

  const autoLayout = () => {
    if(!chars.length) return;

    var GAP   = 40;
    var YS    = NODE_H + 90;
    var SG    = NODE_W + 36;
    var SGAP  = 14;

    // ── Build maps ────────────────────────────────────────────────────────────
    var parentOf={}, childrenOf={}, spouseOf={};
    rels.forEach(function(r){
      if(r.type==="Parent"){
        (parentOf[r.to]     = parentOf[r.to]    ||[]).push(r.from);
        (childrenOf[r.from] = childrenOf[r.from] ||[]).push(r.to);
      }
      if(r.type==="Spouse"||r.type==="Partner"){
        (spouseOf[r.from] = spouseOf[r.from]||[]).push(r.to);
        (spouseOf[r.to]   = spouseOf[r.to]  ||[]).push(r.from);
      }
    });
    Object.keys(childrenOf).forEach(function(id){
      childrenOf[id]=childrenOf[id].filter(function(v,i,a){return a.indexOf(v)===i;});
    });

    // ── Build unit list ───────────────────────────────────────────────────────
    // A "unit" is what occupies one slot in a row:
    //   couple  : two spouse-linked chars side by side
    //   cluster : siblings with same parents, no spouse of their own
    //   solo    : unconnected char

    var units = [];       // [{type, members:[], depth, childUnitIds:[]}]
    var unitOf = {};      // charId → unitIndex (primary unit for layout)
    var inUnit = {};      // charId → [unitIndices]

    // One unit per spouse edge
    var edgeSeen={};
    rels.forEach(function(r){
      if(r.type!=="Spouse"&&r.type!=="Partner") return;
      var key=r.from<r.to?r.from+"|"+r.to:r.to+"|"+r.from;
      if(edgeSeen[key]) return; edgeSeen[key]=true;
      var ui=units.length;
      units.push({type:"couple",members:[r.from,r.to],depth:-1,childUnitIds:[]});
      [r.from,r.to].forEach(function(id){
        (inUnit[id]=inUnit[id]||[]).push(ui);
        if(unitOf[id]===undefined) unitOf[id]=ui;
      });
    });

    // Cluster unsponsed children by parent-set
    var clusterKey={};
    chars.forEach(function(c){
      if(inUnit[c.id]&&inUnit[c.id].length) return;
      var parents=(parentOf[c.id]||[]).slice().sort();
      if(!parents.length){
        // solo
        var ui=units.length;
        units.push({type:"solo",members:[c.id],depth:-1,childUnitIds:[]});
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
        return;
      }
      var pk=parents.join("|");
      if(clusterKey[pk]!==undefined){
        var ui=clusterKey[pk];
        units[ui].members.push(c.id);
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
      } else {
        var ui=units.length;
        clusterKey[pk]=ui;
        units.push({type:"cluster",members:[c.id],depth:-1,childUnitIds:[]});
        (inUnit[c.id]=inUnit[c.id]||[]).push(ui);
        unitOf[c.id]=ui;
      }
    });

    // ── Assign depths ─────────────────────────────────────────────────────────
    units.forEach(function(u,i){
      var hasParent=u.members.some(function(m){return (parentOf[m]||[]).length>0;});
      if(!hasParent) u.depth=0;
    });
    var chg=true,it=0;
    while(chg&&it++<400){
      chg=false;
      units.forEach(function(u,i){
        if(u.depth<0) return;
        u.members.forEach(function(mid){
          (childrenOf[mid]||[]).forEach(function(kid){
            (inUnit[kid]||[]).forEach(function(ci){
              if(ci===i) return;
              if(units[ci].depth<u.depth+1){units[ci].depth=u.depth+1;chg=true;}
            });
          });
        });
      });
    }
    units.forEach(function(u){if(u.depth<0)u.depth=0;});

    // ── Group by depth ────────────────────────────────────────────────────────
    var byDepth={};
    units.forEach(function(u,i){(byDepth[u.depth]=byDepth[u.depth]||[]).push(i);});
    var depths=Object.keys(byDepth).map(Number).sort(function(a,b){return a-b;});

    // ── Unit width ────────────────────────────────────────────────────────────
    function unitW(ui){
      var u=units[ui];
      if(u.type==="couple") return SG+NODE_W;
      if(u.type==="cluster") return u.members.length*NODE_W+(u.members.length-1)*SGAP;
      return NODE_W;
    }

    // ── Subtree width: the width a unit needs including all its descendants ────
    // We compute this bottom-up so parents are always wide enough.
    var subtreeW={};
    depths.slice().reverse().forEach(function(d){
      byDepth[d].forEach(function(ui){
        var u=units[ui];
        // Collect child units (units whose members have this unit's members as parents)
        var childSet={};
        u.members.forEach(function(mid){
          (childrenOf[mid]||[]).forEach(function(kid){
            (inUnit[kid]||[]).forEach(function(ci){
              if(units[ci].depth===u.depth+1) childSet[ci]=true;
            });
          });
        });
        u.childUnitIds=Object.keys(childSet).map(Number);

        var childrenTotalW=0;
        u.childUnitIds.forEach(function(ci,i){
          childrenTotalW+=subtreeW[ci];
          if(i<u.childUnitIds.length-1) childrenTotalW+=GAP;
        });
        subtreeW[ui]=Math.max(unitW(ui), childrenTotalW);
      });
    });

    // ── Top-down placement ────────────────────────────────────────────────────
    var pos={};   // charId → {x,y}
    var unitCX={};// unitIndex → centreX

    function placeUnit(ui, cx, y){
      unitCX[ui]=cx;
      var u=units[ui];
      var w=unitW(ui);
      if(u.type==="couple"){
        var a=u.members[0], b=u.members[1];
        var aS=spouseOf[a]||[], bS=spouseOf[b]||[];
        var leftId,rightId;
        if(aS.length>1){ var bi=aS.indexOf(b); leftId=(bi%2===0)?b:a; rightId=(bi%2===0)?a:b; }
        else if(bS.length>1){ var ai=bS.indexOf(a); leftId=(ai%2===0)?a:b; rightId=(ai%2===0)?b:a; }
        else { leftId=a; rightId=b; }
        pos[leftId] ={x:cx-w/2,     y:y};
        pos[rightId]={x:cx-w/2+SG,  y:y};
      } else if(u.type==="cluster"){
        var n=u.members.length;
        var tw=n*NODE_W+(n-1)*SGAP;
        u.members.forEach(function(mid,i){ pos[mid]={x:cx-tw/2+i*(NODE_W+SGAP),y:y}; });
      } else {
        pos[u.members[0]]={x:cx-NODE_W/2,y:y};
      }

      // Place children spread evenly beneath this unit
      if(!u.childUnitIds.length) return;
      var totalChildW=0;
      u.childUnitIds.forEach(function(ci,i){
        totalChildW+=subtreeW[ci];
        if(i<u.childUnitIds.length-1) totalChildW+=GAP;
      });
      var childY=y+YS;
      var cursor=cx-totalChildW/2;
      u.childUnitIds.forEach(function(ci){
        var sw=subtreeW[ci];
        placeUnit(ci, cursor+sw/2, childY);
        cursor+=sw+GAP;
      });
    }

    // Place root units
    var rootUnits=byDepth[0]||[];
    var totalRootW=0;
    rootUnits.forEach(function(ui,i){totalRootW+=subtreeW[ui];if(i<rootUnits.length-1)totalRootW+=GAP;});
    var rootCursor=-totalRootW/2;
    rootUnits.forEach(function(ui){
      placeUnit(ui, rootCursor+subtreeW[ui]/2, 0);
      rootCursor+=subtreeW[ui]+GAP;
    });

    // ── Multi-pass overlap resolution ─────────────────────────────────────────
    for(var pass=0;pass<4;pass++){
      depths.forEach(function(d){
        var nodes=[], seen={};
        (byDepth[d]||[]).forEach(function(ui){
          units[ui].members.forEach(function(mid){
            if(pos[mid]&&!seen[mid]){seen[mid]=true;nodes.push(mid);}
          });
        });
        nodes.sort(function(a,b){return pos[a].x-pos[b].x;});
        for(var i=1;i<nodes.length;i++){
          var pn=nodes[i-1],cn=nodes[i];
          var need=pos[pn].x+NODE_W+GAP;
          if(pos[cn].x<need){
            var sh=need-pos[cn].x;
            for(var j=i;j<nodes.length;j++) pos[nodes[j]].x+=sh;
            var cui=unitOf[cn];
            if(cui!==undefined) unitCX[cui]=(unitCX[cui]||0)+sh;
          }
        }
      });
    }

    // ── Bottom-up centering: re-center each parent unit over its children ─────
    // Process from deepest to shallowest so children are already in final position
    depths.slice().reverse().forEach(function(d){
      (byDepth[d]||[]).forEach(function(ui){
        var u=units[ui];
        if(!u.childUnitIds||!u.childUnitIds.length) return;

        // Find leftmost and rightmost child node positions
        var childXs=[];
        u.childUnitIds.forEach(function(ci){
          units[ci].members.forEach(function(mid){
            if(pos[mid]) childXs.push(pos[mid].x+NODE_W/2);
          });
        });
        if(!childXs.length) return;
        var childMidX=(Math.min.apply(null,childXs)+Math.max.apply(null,childXs))/2;

        // Current unit centre
        var memberXs=[];
        u.members.forEach(function(mid){ if(pos[mid]) memberXs.push(pos[mid].x+NODE_W/2); });
        if(!memberXs.length) return;
        var unitMidX=(Math.min.apply(null,memberXs)+Math.max.apply(null,memberXs))/2;

        var shift=childMidX-unitMidX;
        if(Math.abs(shift)<1) return;
        u.members.forEach(function(mid){ if(pos[mid]) pos[mid].x+=shift; });
      });
    });

    // ── After centering, one final overlap resolution pass ────────────────────
    for(var pass2=0;pass2<2;pass2++){
      depths.forEach(function(d){
        var nodes=[], seen={};
        (byDepth[d]||[]).forEach(function(ui){
          units[ui].members.forEach(function(mid){
            if(pos[mid]&&!seen[mid]){seen[mid]=true;nodes.push(mid);}
          });
        });
        nodes.sort(function(a,b){return pos[a].x-pos[b].x;});
        for(var i=1;i<nodes.length;i++){
          var pn=nodes[i-1],cn=nodes[i];
          var need=pos[pn].x+NODE_W+GAP;
          if(pos[cn].x<need){
            var sh=need-pos[cn].x;
            for(var j=i;j<nodes.length;j++) pos[nodes[j]].x+=sh;
          }
        }
      });
    }

    // ── Place any still-unpositioned chars ────────────────────────────────────
    var maxX=0;
    Object.keys(pos).forEach(function(id){maxX=Math.max(maxX,pos[id].x+NODE_W);});
    chars.filter(function(c){return !pos[c.id];}).forEach(function(c,i){
      pos[c.id]={x:maxX+(i+1)*(NODE_W+GAP),y:0};
    });

    // ── Normalise ─────────────────────────────────────────────────────────────
    var minX=Infinity,minY=Infinity;
    Object.keys(pos).forEach(function(id){minX=Math.min(minX,pos[id].x);minY=Math.min(minY,pos[id].y);});
    Object.keys(pos).forEach(function(id){pos[id].x+=60-minX;pos[id].y+=60-minY;});

    setPreLayoutChars(chars.map(function(c){return Object.assign({},c);}));
    setChars(function(p){return p.map(function(c){return pos[c.id]?Object.assign({},c,pos[c.id]):c;});});
    showToast("✦ Tree arranged");
  };

  const confirmAutoLayout = () => {
    askConfirm(
      "Auto-Arrange",
      "All card positions will be reset and rearranged automatically. This cannot be undone except by using the Undo button that appears after arranging.",
      autoLayout,
      "Confirm"
    );
  };

  const undoLayout = () => {
    if(!preLayoutChars) return;
    setChars(preLayoutChars);
    setPreLayoutChars(null);
    showToast("↩ Layout restored");
  };

  const onNodeMouseDown = (e,id) => {
    if(e.button!==0) return; e.stopPropagation();
    if(linking&&linking!==id){ addRel(linking,id,linkType); setLinking(null); return; }
    setSelected(id);
    const c=getChar(id); if(!c) return;
    const sr=svgRef.current.getBoundingClientRect();
    setDragging(id); setDragOffset({x:(e.clientX-sr.left)/zoom-pan.x/zoom-c.x,y:(e.clientY-sr.top)/zoom-pan.y/zoom-c.y});
  };

  const onSvgMouseDown = e => {
    if(e.button!==0) return;
    if(linking){setLinking(null);return;}
    panClickRef.current={x:e.clientX,y:e.clientY};
    panRef.current=true; setIsPanning(true); setPanStart({x:e.clientX-pan.x,y:e.clientY-pan.y});
  };

  const onMouseMove = e => {
    if(dragging){
      const sr=svgRef.current.getBoundingClientRect();
      var rawX=Math.max(0,(e.clientX-sr.left)/zoom-pan.x/zoom-dragOffset.x);
      var rawY=Math.max(0,(e.clientY-sr.top)/zoom-pan.y/zoom-dragOffset.y);

      // Snap Y: if within SNAP_Y pixels of another card's Y, snap to it
      var SNAP_Y=18;
      var snapY=rawY;
      var bestDY=SNAP_Y+1;
      chars.forEach(function(c){
        if(c.id===dragging) return;
        var dy=Math.abs(c.y-rawY);
        if(dy<bestDY){ bestDY=dy; snapY=c.y; }
      });

      setChars(function(p){return p.map(function(c){
        return c.id===dragging?Object.assign({},c,{x:rawX,y:snapY}):c;
      });});
    }
    else if(isPanning) setPan({x:e.clientX-panStart.x,y:e.clientY-panStart.y});
  };

  const onMouseUp = e => {
    if(panClickRef.current&&!dragging){
      const dx=e.clientX-panClickRef.current.x, dy=e.clientY-panClickRef.current.y;
      if(Math.sqrt(dx*dx+dy*dy)<5) setSelected(null);
    }

    var parentChildren = {}, childParents = {};
    rels.forEach(function(r){

    //   Parent A ────┬──── Parent B        ← horizontal connector at parent mid-Y
    //                │                     ← vertical stem from couple midpoint
    //           ─────┴─────                ← horizontal child bar
    //           │         │               ← vertical drops to each child
    //         Child1    Child2
    //
    // This means when Dad has Wife1 (left) and Wife2 (right), his node gets:
    //   a line going LEFT  to Wife1's midpoint  (fork 1)
    //   a line going RIGHT to Wife2's midpoint  (fork 2)
    // These are on opposite sides so they never overlap.

    forkGroups.forEach(function(grp){
      var pNodes = grp.parents.map(function(pid){ return getChar(pid); }).filter(Boolean);
      var cNodes = grp.children.map(function(cid){ return getChar(cid); }).filter(Boolean);
      if(!pNodes.length || !cNodes.length) return;

      var isSel = selected && (
        pNodes.some(function(n){ return n.id===selected; }) ||
        cNodes.some(function(n){ return n.id===selected; })
      );
      var isHov = hoveredConnectedSet && (
        pNodes.some(function(n){ return hoveredConnectedSet.has(n.id); }) ||
        cNodes.some(function(n){ return hoveredConnectedSet.has(n.id); })
      );
      var sw = isSel ? 2.5 : 1.5;
      var op = isSel ? 1.0 : (hoveredConnectedSet&&!isHov) ? 0.08 : 0.6;

      var cTopY    = Math.min.apply(null, cNodes.map(function(n){ return n.y; }));
      var pBottomY = Math.max.apply(null, pNodes.map(function(n){ return n.y+NODE_H; }));

      // Minimum distance each parent drops before bending — keeps forks visually distinct
      var FORK_DROP = 28;

      // Stem X = horizontal midpoint between all parents in this group
      var stemX = pNodes.reduce(function(s,n){ return s+n.x+NODE_W/2; },0) / pNodes.length;

      // stemTopY: the Y level where parent elbows meet the vertical stem.
      // Must be at least FORK_DROP below every parent's bottom edge.

      var junctionY = stemTopY + 24;

      if(pNodes.length === 2){

        var p1x = p1.x+NODE_W/2, p1y = p1.y+NODE_H;

        // Each parent drops FORK_DROP then elbows horizontally to stemX

          key: grp.key+"-p0",

        }));
        lines.push(h("polyline",{
          key: grp.key+"-p1",
          points: p1x+","+p1y+" "+p1x+","+stemTopY+" "+stemX+","+stemTopY,
          fill:"none", stroke:parentCol, strokeWidth:sw, strokeOpacity:op, strokeLinejoin:"round"
        }));

        // Vertical stem from couple midpoint down to child junction
        lines.push(h("line",{
          key: grp.key+"-stem",
          x1:stemX, y1:stemTopY, x2:stemX, y2:junctionY,
          stroke:parentCol, strokeWidth:sw, strokeOpacity:op

        var px = pNodes[0].x+NODE_W/2, py = pNodes[0].y+NODE_H;

        junctionY = Math.max(stemTopY + 8, stemTopY + (cTopY - stemTopY) * 0.5);

          key: grp.key+"-stem",
          x1:px, y1:py, x2:px, y2:junctionY,
          stroke:parentCol, strokeWidth:sw, strokeOpacity:op
        }));
        stemX = px;
      }

      // Horizontal child bar spanning all children (or just the stem point if 1 child)
      var cMidXs = cNodes.map(function(n){ return n.x+NODE_W/2; });
      var barL = Math.min.apply(null, cMidXs.concat([stemX]));
      var barR = Math.max.apply(null, cMidXs.concat([stemX]));
      lines.push(h("line",{
        key: grp.key+"-bar",
        x1:barL, y1:junctionY, x2:barR, y2:junctionY,
        stroke:parentCol, strokeWidth:sw, strokeOpacity:op
      }));

      // Vertical drops from child bar down to each child's top
      cNodes.forEach(function(cn, ci){

        lines.push(h("line",{
          key: grp.key+"-c"+ci,

    rels.forEach(function(r){
      if(r.type==="Parent") return;
      var f=getChar(r.from), t=getChar(r.to);

      var fx=f.x+NODE_W/2, fy=f.y+NODE_H/2, tx=t.x+NODE_W/2, ty=t.y+NODE_H/2;

                style:{userSelect:"none",pointerEvents:"none"}},r.type))
