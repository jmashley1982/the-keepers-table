name: Deploy to Cloudflare

# Builds the client + container image and deploys the Worker.
# Runs on every push to main, or manually from the Actions tab.
# Requires one repository secret: CLOUDFLARE_API_TOKEN
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose — it comes from "packageManager" in
      # package.json. Setting both makes this action fail.
      - uses: pnpm/action-setup@v4

      # Node 22+ is required by wrangler. (The container itself still runs
      # Node 20 — that is set separately, in the Dockerfile.)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # The runner is linux/amd64 and has Docker, so wrangler builds and
      # pushes the container image in the right format for Cloudflare.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
